name: ci

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Setup custom moon wrapper
        run: |
          chmod +x scripts/bin/moon
          echo "$PWD/scripts/bin" >> "$GITHUB_PATH"
      - name: Refresh registry
        run: moon update
      - name: Static check
        run: moon check --deny-warn
      - name: Format check
        run: moon fmt --deny-warn
      - name: Generate interfaces
        run: moon info --deny-warn
      - name: Tests
        run: moon test --deny-warn
      - name: CLI smoke
        run: |
          moon run cmd/main -- demo
          moon run cmd/main -- fft examples/sine.csv --sample-rate 8
          moon run cmd/main -- analyze examples/sine.csv --sample-rate 8
          moon run cmd/main -- window hann 4
          moon run cmd/main -- convolve examples/sine.csv examples/kernel.csv
